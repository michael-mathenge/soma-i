name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12.15"
  NODE_VERSION: "24.21.0"
  PNPM_VERSION: "12.11.2"

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.lock') }}
          restore-keys: pip-

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock

      - name: Resolve isolated database target
        # The application requires an absolute path under the OS temp directory.
        # It is resolved at run time because the runner temp root is not fixed.
        run: |
          python -c "import os,tempfile,pathlib;d=pathlib.Path(tempfile.gettempdir()).resolve()/'somai-ci';d.mkdir(parents=True,exist_ok=True);p=d/'test.sqlite3';print('DATABASE_URL=sqlite:///'+str(p).replace(chr(92),'/'))" >> "$GITHUB_ENV"
          mkdir -p "$(python -c "import tempfile,pathlib;print(pathlib.Path(tempfile.gettempdir()).resolve()/'somai-ci')")"

      - name: Django system check
        env:
          SOMA_ENV: test
          DJANGO_DEBUG: "false"
        run: python backend/manage.py check

      - name: Django migration check
        env:
          SOMA_ENV: test
          DJANGO_DEBUG: "false"
        run: python backend/manage.py makemigrations --check --dry-run

      - name: Ruff lint
        run: python -m ruff check backend

      - name: Ruff format check on changed files
        # Ruff format is checked against the files a pull request touches.
        # The repository carries pre-existing format drift that the owner
        # resolves in a separate Black/format pass, so checking the whole
        # tree here would block every unrelated pull request.
        env:
          # The base branch differs between a pull request and a push, and
          # the push event has no base ref at all.
          BASE_REF: ${{ github.base_ref || github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # Fetch enough history to find the merge base with the base branch.
          # A shallow fetch alone leaves no merge base, so unshallow when needed.
          git fetch --no-tags origin "$BASE_REF"
          git fetch --no-tags --unshallow origin 2>/dev/null || git fetch --no-tags origin
          BASE=$(git merge-base "origin/$BASE_REF" HEAD)
          if [ -z "$BASE" ]; then
            echo "No merge base found; skipping the scoped format check."
            exit 0
          fi
          git diff --name-only --diff-filter=ACMR "$BASE" HEAD -- backend/ > /tmp/changed.txt
          FILES=$(grep '\.py$' /tmp/changed.txt || true)
          if [ -z "$FILES" ]; then
            echo "No changed Python files to format-check."
            exit 0
          fi
          echo "Format-checking:"; echo "$FILES"
          python -m ruff format --check $FILES

      - name: Pytest
        env:
          SOMA_ENV: test
          DJANGO_DEBUG: "false"
        run: python -m pytest backend -q

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install locked dependencies
        run: npx --yes pnpm@${{ env.PNPM_VERSION }} install --frozen-lockfile

      - name: Verify the lockfile is current
        # A frozen install proves the lockfile is usable. This proves it still
        # matches package.json, so a dependency change cannot be merged with a
        # stale lockfile.
        run: |
          npx --yes pnpm@${{ env.PNPM_VERSION }} install --lockfile-only
          if ! git diff --quiet -- pnpm-lock.yaml; then
            echo "::error file=frontend/pnpm-lock.yaml::The lockfile does not match package.json. Run pnpm install and commit the result."
            git diff -- pnpm-lock.yaml
            exit 1
          fi

      - name: ESLint
        run: npx --yes pnpm@${{ env.PNPM_VERSION }} run lint

      - name: Prettier check
        run: npx --yes pnpm@${{ env.PNPM_VERSION }} exec prettier --check "src/**/*.{js,jsx,json,css}"

      - name: Production build
        run: npx --yes pnpm@${{ env.PNPM_VERSION }} run build

      - name: Database guard tests
        run: npx --yes pnpm@${{ env.PNPM_VERSION }} run test:e2e:guard

      - name: Teardown robustness tests
        run: npx --yes pnpm@${{ env.PNPM_VERSION }} run test:e2e:robustness

  browser:
    name: browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npx --yes pnpm@${{ env.PNPM_VERSION }} install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx --yes pnpm@${{ env.PNPM_VERSION }} exec playwright install --with-deps chromium

      - name: Build the frontend
        # The browser job serves the production bundle, so it must exist
        # before the Playwright web server starts.
        working-directory: frontend
        run: npx --yes pnpm@${{ env.PNPM_VERSION }} run build

      - name: Resolve isolated database target
        run: |
          python -c "import tempfile,pathlib;d=pathlib.Path(tempfile.gettempdir()).resolve()/'somai-ci';d.mkdir(parents=True,exist_ok=True);p=d/'test.sqlite3';print('DATABASE_URL=sqlite:///'+str(p).replace(chr(92),'/'))" >> "$GITHUB_ENV"

      - name: Point the browser suite at the runner interpreter
        # The suite resolves Python from PYTHON, then a repository virtual
        # environment, then "py". CI has no virtual environment and no "py"
        # launcher on Linux, so the runner interpreter is supplied directly.
        run: echo "PYTHON=$(command -v python)" >> "$GITHUB_ENV"

      - name: Playwright journey
        working-directory: frontend
        env:
          SOMA_ENV: test
          DJANGO_DEBUG: "false"
        run: npx --yes pnpm@${{ env.PNPM_VERSION }} exec playwright test

      - name: Upload browser failure context
        # The error context records the rendered page at the moment of
        # failure, which is the only way to diagnose a browser failure from
        # the job log alone.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-context
          path: |
            frontend/test-results/**/error-context.md
            frontend/playwright-report/**
          retention-days: 7
          if-no-files-found: ignore

  container:
    name: container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: soma-i:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run the image
        run: |
          docker run -d --name soma-i -p 8000:8000 \
            -e SOMA_ENV=development \
            -e DATABASE_URL=sqlite:////tmp/soma-ci.sqlite3 \
            -e DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1 \
            -e DJANGO_DEBUG=false \
            -e DJANGO_HSTS_SECONDS=0 \
            soma-i:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health/ > /dev/null; then
              echo "The container reported a healthy API."
              break
            fi
            if [ "$attempt" = "30" ]; then
              echo "::error::The container did not become healthy."
              docker logs soma-i
              exit 1
            fi
            sleep 2
          done

      - name: Verify the container serves the application and its assets
        run: |
          # The API answers for its own routes.
          curl -fsS http://127.0.0.1:8000/api/health/ | grep -q '"status":"ok"'
          # A client-side route returns the application shell.
          curl -fsS http://127.0.0.1:8000/catalogue | grep -q '<div id="root">'
          # The assets the shell references are served with their own types,
          # not as the shell document.
          asset=$(curl -fsS http://127.0.0.1:8000/catalogue | grep -o '/assets/[^"]*\.js' | head -1)
          curl -fsS -o /dev/null -w '%{content_type}\n' "http://127.0.0.1:8000$asset" | grep -q 'javascript'
          echo "The container serves the application, the API and the assets."

      - name: Container logs
        if: failure()
        run: docker logs soma-i
